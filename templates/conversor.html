<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Conversor</title>

    <style>
        body {
            background: linear-gradient(135deg, #0a3d62, #3c91e6);
            min-height: 100vh;
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        .card:hover {
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        label {
            color: #ffffff;
            font-weight: 500;
        }

        .form-control {
            background-color: rgba(255,255,255,0.1);
            border: none;
            color: white;
        }

        .form-control::placeholder {
            color: #ccc;
        }

        .form-control:focus {
            background-color: rgba(255,255,255,0.15);
            color: white;
            box-shadow: none;
        }

        .btn-custom {
            background: #3c91e6;
            border: none;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #1e6fbf;
            transform: scale(1.03);
        }

        .navbar {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .navbar-brand {
            color: #ffffff !important;
        }

        .nav-link {
            color: #e0e0e0 !important;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #ffffff !important;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <!-- Título -->
        <a class="navbar-brand fw-bold" href="index.html">Bases Numéricas</a>

        <!-- Botão mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links -->
        <div class="collapse navbar-collapse justify-content-end" id="menu">
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Início</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="conversor.html">Conversor</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">Sobre</a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<main class="container py-5">

    <h1 class="text-center text-white mb-5">Conversor de Bases</h1>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">

                <div class="row g-4">

                    <div class="col-md-4">
                        <label for="input_Dec">Decimal</label>
                        <input class="form-control mb-2" type="text" id="input_Dec" placeholder="Digite um número">
                        <button class="btn btn-custom text-white w-100" id="button_Dec">
                            Converter
                        </button>
                    </div>

                    <div class="col-md-4">
                        <label for="input_Bin">Binário</label>
                        <input class="form-control mb-2" type="text" id="input_Bin" placeholder="Digite um número">
                        <button class="btn btn-custom text-white w-100" id="button_Bin">
                            Converter
                        </button>
                    </div>

                    <div class="col-md-4">
                        <label for="input_Hex">Hexadecimal</label>
                        <input class="form-control mb-2" type="text" id="input_Hex" placeholder="Digite um número">
                        <button class="btn btn-custom text-white w-100" id="button_Hex">
                            Converter
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
