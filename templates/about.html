<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Sobre Nós</title>

    <style>
        body {
            background: linear-gradient(135deg, #0a3d62, #3c91e6);
            min-height: 100vh;
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        h4 {
            color: #ffffff;
        }

        p {
            color: #e0e0e0;
            font-size: 1.05rem;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .navbar-brand {
            color: #ffffff !important;
        }

        .nav-link {
            color: #e0e0e0 !important;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #ffffff !important;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
 
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <!-- Título -->
        <a class="navbar-brand fw-bold" href="/">Bases Numéricas</a>

        <!-- Botão mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links -->
        <div class="collapse navbar-collapse justify-content-end" id="menu">
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="/">Início</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/conversor">Conversor</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">Sobre</a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<main class="container py-5">

    <h1 class="text-center text-white mb-5">Sobre Nós</h1>

    <div class="row g-4 justify-content-center">

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h4 class="mb-3">Luis Ricardo</h4>
                <p>
                    Desenvolveu as páginas <strong>Index</strong>, <strong>Conversor</strong> e <strong>About</strong>.
                </p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h4 class="mb-3">Johann Saconni</h4>
                <p>
                    Implementou os conversores de <strong>Decimal</strong>, <strong>Binário</strong> e <strong>Hexadecimal</strong>.
                </p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h4 class="mb-3">Lucas Rosa</h4>
                <p>
                    Responsável pelo <strong>JavaScript</strong> (integração com API) e documentação (<strong>README</strong>).
                </p>
            </div>
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
